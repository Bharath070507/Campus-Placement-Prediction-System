<!DOCTYPE html>
<html>
<head>
    <title>Campus Placement Predictor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1 class="main-title">Campus Placement Prediction System</h1>

    <div class="container">
        <form class="form-box" action="/predict" method="post">

            <label>10th Percentage</label>
            <input type="number" step="any" name="ssc_p" placeholder="SSC %" required>

            <label>Inter Percentage</label>
            <input type="number" step="any" name="hsc_p" placeholder="HSC %" required>

            <label>Degree Percentage</label>
            <input type="number" step="any" name="degree_p" placeholder="Degree %" required>

            <label>Employability Test %</label>
            <input type="number" step="any" name="etest_p" placeholder="E-test %"required>

            <label>MBA Percentage</label>
            <input type="number" step="any" name="mba_p" placeholder="MBA %"required>

            <label>Projects Completed</label>
            <input type="number" name="projects" placeholder="NUMBER OF PROJECTS YOU DONE" required>

            <label>Certifications</label>
            <input type="number" name="certification" placeholder="NUMBER OF CERTIFICATES YOU GOT" required>

            <label>Gender</label>
            <select name="gender" required>
                <option value="1">Male</option>
                <option value="0">Female</option>
            </select>

            <label>Work Experience</label>
            <select name="workex" required>
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>

            <label>SSC Board</label>
            <select name="ssc_b" required>
                <option value="0">Central</option>
                <option value="1">Others</option>
            </select>

            <label>HSC Board</label>
            <select name="hsc_b" required>
                <option value="0">Central</option>
                <option value="1">Others</option>
            </select>

            <label>HSC Stream</label>
            <select name="hsc_s" required>
                <option value="Science">Math & Science</option>
                <option value="Commerce">Commerce</option>
                <option value="Arts">Arts</option>
            </select>

            <label>Degree Type</label>
            <select name="degree_t" required>
                <option value="Sci&Tech">Sci & Tech</option>
                <option value="Comm&Mgmt">Commerce & Mgmt</option>
                <option value="Others">Others</option>
            </select>

            <label>MBA Specialisation</label>
            <select name="specialisation" required>
                <option value="Mkt&HR">Marketing & HR</option>
                <option value="Mkt&Fin">Marketing & Finance</option>
            </select>

            <button type="submit">Predict Placement</button>
        </form>

        {% if prediction %}
        <div class="result-box animate-result">
            {{ prediction }}
        </div>
        {% endif %}
    </div>

</body>
</html>
